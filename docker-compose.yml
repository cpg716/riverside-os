# Canonical local PostgreSQL for Riverside OS (use this as the only dev database).
# Credentials and DB name match server/.env.example and server default DATABASE_URL when unset.
#
# 1. docker compose up -d
# 2. Apply all migrations: ./scripts/apply-migrations-docker.sh
#    Status: ./scripts/migration-status-docker.sh — see DEVELOPER.md for the full migration list.
#
# Host port 5433 → container 5432 so local dev does not collide with a native Postgres on localhost:5432
# (Homebrew / Postgres.app often own 5432; the API would then hit the wrong empty `riverside_os`).
#
# Cube Core powers native ROS Insights at http://127.0.0.1:4000. ROS is the only
# staff-facing client; Cube is bound to loopback and uses the versioned semantic model in ./cube.

services:
  db:
    # pgvector so migrations 62–65 (CREATE EXTENSION vector) apply on fresh DBs; migration 78 drops the extension after AI tables are removed.
    image: pgvector/pgvector:pg16
    container_name: riverside-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: riverside_os
    ports:
      - "5433:5432"
    volumes:
      - riverside_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d riverside_os -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Local fuzzy search sidecar for inventory, CRM, weddings, orders, and storefront PLP.
  # npm run dev starts and verifies this service when RIVERSIDE_MEILISEARCH_URL is configured.
  # Set RIVERSIDE_MEILISEARCH_URL=http://127.0.0.1:7700 and RIVERSIDE_MEILISEARCH_API_KEY to match MEILI_MASTER_KEY.
  meilisearch:
    image: getmeili/meilisearch:v1.49.0
    container_name: riverside-os-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key_change_me}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_SCHEDULE_SNAPSHOT: "86400"
      MEILI_SNAPSHOT_DIR: /meili_data/snapshots
      MEILI_DUMP_DIR: /meili_data/dumps
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - riverside_meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Headless semantic/query layer for native ROS Insights.
  cube:
    image: cubejs/cube:v1.7.16
    container_name: riverside-os-cube
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: db
      CUBEJS_DB_PORT: 5432
      CUBEJS_DB_NAME: ${POSTGRES_DB:-riverside_os}
      # Cube never receives the application owner credential. Set a separately managed
      # password on the migration-provisioned cube_ro role before starting this service.
      CUBEJS_DB_USER: ${RIVERSIDE_CUBE_REPORTING_DB_USER:-cube_ro}
      CUBEJS_DB_PASS: ${RIVERSIDE_CUBE_REPORTING_DB_PASSWORD:-}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-change_me_cube_api_secret_at_least_32_chars}
      CUBEJS_DEV_MODE: "false"
      CUBEJS_TELEMETRY: "false"
      CUBEJS_DB_QUERY_DEFAULT_LIMIT: "500"
      TZ: America/New_York
    volumes:
      - ./cube:/cube/conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  riverside_pgdata:
  riverside_meili_data:
